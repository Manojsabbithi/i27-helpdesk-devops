apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: i27-helpdesk-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: asia-south1-docker.pkg.dev/i27-helpdesk-manoj-2026/i27-helpdesk/auth-service:v1
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: i27-app-config
                  key: DB_JDBC_URL
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: i27-app-config
                  key: DB_HOST
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: i27-app-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRY_MILLIS
              valueFrom:
                configMapKeyRef:
                  name: i27-app-config
                  key: JWT_EXPIRY_MILLIS
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: i27-helpdesk-dev
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: i27-helpdesk-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: asia-south1-docker.pkg.dev/i27-helpdesk-manoj-2026/i27-helpdesk/notification-service:v1
          ports:
            - containerPort: 8084
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: DATABASE_URL
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: TICKET_SERVICE_URL
              value: "http://ticket-service:8082"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: SMTP_PASSWORD
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: i27-helpdesk-dev
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: i27-helpdesk-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: asia-south1-docker.pkg.dev/i27-helpdesk-manoj-2026/i27-helpdesk/gateway:v2
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: UI_ORIGIN
              value: "*"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: TICKET_SERVICE_URL
              value: "http://ticket-service:8082"
            - name: COMMENT_SERVICE_URL
              value: "http://comment-service:8083"
            - name: ATTACHMENT_SERVICE_URL
              value: "http://attachment-service:8085"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: i27-app-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: i27-helpdesk-dev
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"ports":{"8080":"gateway-backendconfig"}}'
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ui-backendconfig
  namespace: i27-helpdesk-dev
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /
    port: 3000
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gateway-backendconfig
  namespace: i27-helpdesk-dev
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
